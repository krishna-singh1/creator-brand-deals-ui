openapi: 3.1.0
info:
  title: BrandDeal API
  version: 1.0.0
  summary: Marketplace connecting Indian D2C brands with Instagram/Facebook micro-influencers.
  description: |
    Source of truth for the HTTP API (see docs/adr/0002-contract-first-openapi.md).

    Conventions:
    - Money is integer **paise** (`*Paise`), currency is always INR.
    - `format: date` values are IST business days; `format: date-time` values are UTC.
    - Optional fields without a value are omitted from responses.
    - Every non-GET request must send `X-Requested-With: fetch` (CSRF protection).
    - Auth uses httpOnly cookies set by the auth endpoints (`bd_at` access, `bd_rt` refresh).
    - The web app is deployed separately and calls the API directly with `credentials: 'include'`;
      only allow-listed origins pass CORS (docs/adr/0008-separate-deployments-direct-api.md).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.{domain}/api/v1
    description: Deployed API (separate from the web app)
    variables:
      domain:
        default: branddeal.in
        description: Parent domain shared by web and API
  - url: http://localhost:8080/api/v1
    description: Local API
security:
  - cookieAuth: []
tags:
  - name: auth
    description: Login, tokens, current user
  - name: user
    description: Role, consents, account
  - name: catalog
    description: Master data
  - name: file
    description: Upload/download via presigned URLs
  - name: creator
    description: Creator profile, verification, rate card
  - name: brand
    description: Brand profile and creator discovery
  - name: campaign
    description: Brand campaigns (requirements) and creator feed
  - name: application
    description: Creator applications and brand decisions
  - name: deal
    description: Approved collaborations, submissions, payments, reviews
  - name: notification
    description: In-app notifications
  - name: admin
    description: Internal admin console

paths:
  # ───────────────────────────── auth ─────────────────────────────
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Send a 6-digit login code to an email address
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: Code sent (always returned for valid input to avoid account enumeration)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequested' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Verify the code, create the user if new, and set auth cookies
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Logged in. Sets `bd_at` and `bd_rt` cookies.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAuthCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: loginWithPassword
      summary: Sign in (or sign up) with email and password
      description: >
        If the email belongs to an account **with a password**, the password is checked: `200` signs in, a mismatch is
        `401 INVALID_CREDENTIALS`. If the email is **new or has no password yet** (not verified for password sign-in),
        the password is checked against the policy and a 6-digit code is emailed: `202 VERIFY_EMAIL`. The client then
        calls `POST /auth/password/reset` with the code and the same password, which verifies the email, saves the
        password and signs in. Failed password checks are throttled per email and per IP (`429 RATE_LIMITED`); the
        code path follows the OTP rate limits.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordLoginRequest' }
      responses:
        '200':
          description: Logged in. Sets `bd_at` and `bd_rt` cookies.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAuthCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '202':
          description: Email not verified yet; a code was sent. Finish with `POST /auth/password/reset`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationRequired' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Verify an emailed code and set the password (first sign-in, or forgot password)
      description: >
        Proves email ownership with the one-time code (sent by `/auth/login` for unverified emails, or by
        `/auth/otp/request` for "forgot password"), creates the account if new, sets the password, signs out every
        other session and signs this browser in.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password set and logged in. Sets `bd_at` and `bd_rt` cookies.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAuthCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/google:
    post:
      tags: [auth]
      operationId: loginWithGoogle
      summary: Exchange a Google Identity Services ID token for a session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleLoginRequest' }
      responses:
        '200':
          description: Logged in. Sets `bd_at` and `bd_rt` cookies.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAuthCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Rotated. New cookies set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAuthCookies' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the refresh token and clear cookies
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Logged out
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user and onboarding state
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ───────────────────────────── user ─────────────────────────────
  /me/password:
    put:
      tags: [user]
      operationId: setMyPassword
      summary: Create a password (first time) or change it (current password required)
      description: >
        If the account already has a password, `currentPassword` must match (`422` with
        `details.fields.currentPassword` otherwise). Other sessions are signed out; this browser gets fresh cookies.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordRequest' }
      responses:
        '200':
          description: Password saved. Sets fresh `bd_at` and `bd_rt` cookies.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAuthCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/role:
    post:
      tags: [user]
      operationId: selectRole
      summary: Choose CREATOR or BRAND (once)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectRoleRequest' }
      responses:
        '200':
          description: Role set. Access token cookie re-issued with the new role.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetAuthCookies' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /me/consents:
    post:
      tags: [user]
      operationId: acceptConsents
      summary: Record acceptance of policy versions
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptConsentsRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /me:
    delete:
      tags: [user]
      operationId: deleteMyAccount
      summary: Delete account and anonymise personal data (DPDP)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Account deleted, cookies cleared
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── catalog ─────────────────────────────
  /catalog/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Active categories (niches)
      security: []
      responses:
        '200':
          description: Categories ordered by sortOrder
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /catalog/cities:
    get:
      tags: [catalog]
      operationId: searchCities
      summary: Search Indian cities by name prefix
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Matching cities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/City' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /catalog/languages:
    get:
      tags: [catalog]
      operationId: listLanguages
      summary: Supported content languages
      security: []
      responses:
        '200':
          description: Languages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Language' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /catalog/deliverable-types:
    get:
      tags: [catalog]
      operationId: listDeliverableTypes
      summary: Active deliverable types
      security: []
      responses:
        '200':
          description: Deliverable types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeliverableTypeInfo' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ───────────────────────────── file ─────────────────────────────
  /files/presign:
    post:
      tags: [file]
      operationId: presignUpload
      summary: Get a presigned PUT URL to upload a file directly to storage
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignUploadRequest' }
      responses:
        '201':
          description: Upload URL created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignedUpload' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /files/{fileId}/url:
    get:
      tags: [file]
      operationId: getFileUrl
      summary: Short-lived download URL (owner, deal participant or admin)
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Download URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileUrl' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── creator ─────────────────────────────
  /creator/profile:
    get:
      tags: [creator]
      operationId: getMyCreatorProfile
      summary: Own creator profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [creator]
      operationId: updateMyCreatorProfile
      summary: Update own creator profile
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCreatorProfileRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /creator/social-accounts:
    get:
      tags: [creator]
      operationId: listMySocialAccounts
      summary: Own social accounts
      responses:
        '200':
          description: Social accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SocialAccount' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [creator]
      operationId: addSocialAccount
      summary: Add an Instagram or Facebook account with self-declared stats
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialAccountRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialAccount' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /creator/social-accounts/{socialAccountId}:
    put:
      tags: [creator]
      operationId: updateSocialAccount
      summary: Update a social account (large follower changes trigger re-verification)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/SocialAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocialAccountRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialAccount' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [creator]
      operationId: deleteSocialAccount
      summary: Remove a social account
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/SocialAccountId'
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /creator/portfolio:
    get:
      tags: [creator]
      operationId: listMyPortfolio
      summary: Own portfolio items
      responses:
        '200':
          description: Portfolio items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortfolioItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [creator]
      operationId: addPortfolioItem
      summary: Add a portfolio link (max 6)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioItemRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /creator/portfolio/{portfolioItemId}:
    delete:
      tags: [creator]
      operationId: deletePortfolioItem
      summary: Remove a portfolio item
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: portfolioItemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /creator/rates:
    get:
      tags: [creator]
      operationId: getMyRateCard
      summary: Own rate card with platform suggestions alongside
      responses:
        '200':
          description: Rate card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateCard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [creator]
      operationId: updateMyRateCard
      summary: Replace own rate card
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRateCardRequest' }
      responses:
        '200':
          description: Updated rate card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateCard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /creator/verification:
    get:
      tags: [creator]
      operationId: getMyVerification
      summary: Latest verification request status
      responses:
        '200':
          description: Latest verification request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [creator]
      operationId: submitVerification
      summary: Submit profile for admin verification with Insights screenshots
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitVerificationRequest' }
      responses:
        '201':
          description: Submitted; profile status becomes PENDING_VERIFICATION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /creator/price-suggestions:
    get:
      tags: [creator]
      operationId: getMyPriceSuggestions
      summary: Suggested price ranges for every deliverable type on the creator's platforms
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PriceSuggestion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /creator/dashboard:
    get:
      tags: [creator]
      operationId: getCreatorDashboard
      summary: Counts and pending actions for the creator home screen
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatorDashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /creator/applications:
    get:
      tags: [application]
      operationId: listMyApplications
      summary: Creator's own applications
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ApplicationStatus' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of applications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyApplicationPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── brand ─────────────────────────────
  /brand/profile:
    get:
      tags: [brand]
      operationId: getMyBrandProfile
      summary: Own brand profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [brand]
      operationId: updateMyBrandProfile
      summary: Update own brand profile
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBrandProfileRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
