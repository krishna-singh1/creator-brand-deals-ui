        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bd_at
      description: Short-lived JWT access token set by the auth endpoints.
    refreshCookie:
      type: apiKey
      in: cookie
      name: bd_rt
      description: Opaque refresh token, only sent to /auth paths.

  headers:
    SetAuthCookies:
      description: '`bd_at` (access, 15 min) and `bd_rt` (refresh, 30 days); HttpOnly; Secure; SameSite=Lax'
      schema: { type: string }

  parameters:
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      description: Must be `fetch`. Protects against cross-site form posts.
      schema:
        type: string
        const: fetch
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 64 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DealId:
      name: dealId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CreatorId:
      name: creatorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SocialAccountId:
      name: socialAccountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VerificationId:
      name: verificationId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request or domain-level bad input (e.g. OTP_INVALID)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Not allowed (role, status, CSRF header)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found or not accessible to the caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: State conflict (duplicate, invalid transition)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          description: Seconds to wait
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotImplemented:
      description: P1 operation not yet available
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ─────────── errors ───────────
    ErrorCode:
      type: string
      enum:
        - MALFORMED_REQUEST
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATE_TRANSITION
        - RATE_LIMITED
        - INTERNAL_ERROR
        - NOT_IMPLEMENTED
        - INVALID_CREDENTIALS
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_TOO_MANY_ATTEMPTS
        - GOOGLE_TOKEN_INVALID
        - REFRESH_TOKEN_INVALID
        - ACCOUNT_SUSPENDED
        - ROLE_NOT_SELECTED
        - ROLE_ALREADY_SET
        - CONSENT_REQUIRED
        - PROFILE_INCOMPLETE
        - CREATOR_NOT_VERIFIED
        - CREATOR_UNDERAGE
        - VERIFICATION_ALREADY_PENDING
        - CATEGORY_LIMIT_EXCEEDED
        - CREATOR_NOT_ELIGIBLE
        - APPLICATION_ALREADY_EXISTS
        - CAMPAIGN_NOT_OPEN
        - CAMPAIGN_FILLED
        - DISCLOSURE_REQUIRED
        - REVIEW_ALREADY_EXISTS
        - FILE_TYPE_NOT_ALLOWED
        - FILE_TOO_LARGE
        - FILE_NOT_UPLOADED
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            traceId: { type: string }

    # ─────────── enums ───────────
    Role:
      type: string
      enum: [CREATOR, BRAND, ADMIN]
    SelectableRole:
      type: string
      enum: [CREATOR, BRAND]
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DELETED]
    ConsentType:
      type: string
      enum: [TERMS, PRIVACY, ASCI_CODE, BRAND_CODE, MARKETING]
    Platform:
      type: string
      enum: [INSTAGRAM, FACEBOOK]
    DeliverableType:
      type: string
      enum: [IG_REEL, IG_POST, IG_CAROUSEL, IG_STORY, FB_POST, FB_REEL]
    CompensationType:
      type: string
      description: CASH = cash only, PRODUCT = barter (product only), PRODUCT_PLUS_CASH = product plus cash
      enum: [CASH, PRODUCT, PRODUCT_PLUS_CASH]
    CompensationFilter:
      type: string
      enum: [CASH, BARTER, BOTH]
    Gender:
      type: string
      enum: [FEMALE, MALE, NON_BINARY, PREFER_NOT_TO_SAY]
    GenderPreference:
      type: string
      enum: [ANY, FEMALE, MALE]
    CreatorStatus:
      type: string
      enum: [DRAFT, PENDING_VERIFICATION, VERIFIED, REJECTED, SUSPENDED]
    BrandStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    MetricSource:
      type: string
      enum: [SELF_DECLARED, ADMIN_VERIFIED, META_API]
    VerificationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    CampaignStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CLOSED, ARCHIVED, UNPUBLISHED_BY_ADMIN]
    ApplicationStatus:
      type: string
      enum: [INVITED, APPLIED, SHORTLISTED, APPROVED, REJECTED, WITHDRAWN, DECLINED, EXPIRED]
    ApplicationOrigin:
      type: string
      enum: [APPLIED, INVITED]
    DealStatus:
      type: string
      enum:
        - ACTIVE
        - PRODUCT_SHIPPED
        - PRODUCT_RECEIVED
        - IN_PROGRESS
        - UNDER_REVIEW
        - CONTENT_APPROVED
        - PAYMENT_MARKED
        - COMPLETED
        - CANCELLED
        - DISPUTED
    DeliverableStatus:
      type: string
      enum: [PENDING, SUBMITTED, CHANGES_REQUESTED, APPROVED]
    SubmissionReviewStatus:
      type: string
      enum: [PENDING, APPROVED, CHANGES_REQUESTED]
    PaymentMode:
      type: string
      enum: [UPI, BANK_TRANSFER, OTHER]
    FilePurpose:
      type: string
      enum: [AVATAR, BRAND_LOGO, VERIFICATION_PROOF, CAMPAIGN_BRIEF, SUBMISSION_SCREENSHOT, PORTFOLIO_THUMBNAIL]
    FollowerTier:
      type: string
      enum: [T1, T2, T3, T4, T5]
    CompanySize:
      type: string
      enum: [SOLO, S_2_10, S_11_50, S_51_200, S_200_PLUS]
    DisputeReason:
      type: string
      enum: [NOT_PAID, NOT_DELIVERED, CONTENT_ISSUE, PRODUCT_NOT_RECEIVED, OTHER]
    NotificationType:
      type: string
      enum:
        - VERIFICATION_APPROVED
        - VERIFICATION_REJECTED
        - APPLICATION_RECEIVED
        - APPLICATION_APPROVED
        - APPLICATION_REJECTED
        - INVITE_RECEIVED
        - PRODUCT_SHIPPED
        - SUBMISSION_RECEIVED
        - SUBMISSION_APPROVED
        - CHANGES_REQUESTED
        - PAYMENT_MARKED
        - PAYMENT_CONFIRMED
        - DEAL_CANCELLED
        - DEAL_COMPLETED
        - SYSTEM

    # ─────────── shared ───────────
    Paise:
      type: integer
      format: int64
      minimum: 0
      description: Amount in paise (₹1 = 100)
    PriceRange:
      type: object
      required: [minPaise, maxPaise]
      properties:
        minPaise: { $ref: '#/components/schemas/Paise' }
        maxPaise: { $ref: '#/components/schemas/Paise' }
        estimated:
          type: boolean
          description: True when based on self-declared (not admin-verified) metrics
    ReasonRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    ReasonRequired:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    CommentRequest:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 3, maxLength: 1000 }
    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
    Contact:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: E.164 }

    # ─────────── auth / user ───────────
    OtpRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    OtpRequested:
      type: object
      required: [expiresInSeconds, resendAfterSeconds]
      properties:
        expiresInSeconds: { type: integer }
        resendAfterSeconds: { type: integer }
    OtpVerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        otp: { type: string, pattern: '^[0-9]{6}$' }
    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: 8–128 characters. Common passwords and the account email are rejected.
    EmailVerificationRequired:
      type: object
      required: [next, expiresInSeconds, resendAfterSeconds]
      properties:
        next: { type: string, enum: [VERIFY_EMAIL] }
        expiresInSeconds: { type: integer }
        resendAfterSeconds: { type: integer }
    PasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    ResetPasswordRequest:
      type: object
      required: [email, otp, newPassword]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        otp: { type: string, pattern: '^[0-9]{6}$' }
        newPassword: { $ref: '#/components/schemas/Password' }
    SetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string, maxLength: 128, description: Required when the account already has a password }
        newPassword: { $ref: '#/components/schemas/Password' }
    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string, minLength: 10, maxLength: 4096 }
    Me:
      type: object
      required: [id, email, status, hasPassword, onboarding]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        hasPassword: { type: boolean, description: Whether email + password sign-in is set up }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
        onboarding:
          type: object
          required: [passwordRequired, roleSelected, consentsAccepted, profileComplete]
          properties:
            passwordRequired:
              type: boolean
              description: True when the user has neither a password nor Google sign-in; the web app asks them to create one
            roleSelected: { type: boolean }
            consentsAccepted: { type: boolean }
            profileComplete: { type: boolean }
            creatorStatus: { $ref: '#/components/schemas/CreatorStatus' }
            pendingConsents:
              type: array
              description: Policies (at their current version) the user still has to accept
              items: { $ref: '#/components/schemas/PolicyVersion' }
    PolicyVersion:
      type: object
      required: [type, version]
      properties:
        type: { $ref: '#/components/schemas/ConsentType' }
        version: { type: string }
    SelectRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/SelectableRole' }
    AcceptConsentsRequest:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, version]
            properties:
              type: { $ref: '#/components/schemas/ConsentType' }
              version: { type: string, maxLength: 20 }

    # ─────────── catalog ───────────
    Category:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
    City:
      type: object
      required: [id, name, state, tier]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string }
        tier: { type: integer, minimum: 1, maximum: 3 }
    Language:
      type: object
      required: [code, name]
      properties:
        code: { type: string, description: ISO 639-1 }
        name: { type: string }
    DeliverableTypeInfo:
      type: object
      required: [code, platform, label]
      properties:
        code: { $ref: '#/components/schemas/DeliverableType' }
        platform: { $ref: '#/components/schemas/Platform' }
        label: { type: string }
        description: { type: string }

    # ─────────── files ───────────
    PresignUploadRequest:
      type: object
      required: [purpose, contentType, sizeBytes]
      properties:
        purpose: { $ref: '#/components/schemas/FilePurpose' }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        fileName: { type: string, maxLength: 200 }
    PresignedUpload:
      type: object
      required: [fileId, uploadUrl, method, headers, expiresAt]
      properties:
        fileId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        method:
          type: string
          const: PUT
        headers:
          type: object
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    FileUrl:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    # ─────────── creator ───────────
    AudienceInfo:
      type: object
      properties:
        topCityIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
        femalePercent: { type: integer, minimum: 0, maximum: 100 }
        malePercent: { type: integer, minimum: 0, maximum: 100 }
        topAgeBand:
          type: string
          enum: [AGE_13_17, AGE_18_24, AGE_25_34, AGE_35_44, AGE_45_PLUS]
    CreatorProfile:
      type: object
      required: [id, status, categoryIds, languages]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/CreatorStatus' }
        displayName: { type: string }
        fullName: { type: string }
        avatarUrl: { type: string, format: uri }
        bio: { type: string }
        gender: { $ref: '#/components/schemas/Gender' }
        dateOfBirth: { type: string, format: date }
        city: { $ref: '#/components/schemas/City' }
        languages:
          type: array
          items: { type: string }
        categoryIds:
          type: array
          maxItems: 3
          items: { type: string, format: uuid }
        phone: { type: string }
        contactEmail: { type: string, format: email }
        audience: { $ref: '#/components/schemas/AudienceInfo' }
        ratingAvg: { type: number }
        ratingCount: { type: integer }
        dealsCompleted: { type: integer }
        missingFields:
          type: array
          description: Fields required before verification can be submitted
          items: { type: string }
    UpdateCreatorProfileRequest:
      type: object
      required: [displayName, fullName, dateOfBirth, cityId, languages, categoryIds, phone, contactEmail]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 60 }
        fullName: { type: string, minLength: 2, maxLength: 100 }
        avatarFileId: { type: string, format: uuid }
        bio: { type: string, maxLength: 500 }
        gender: { $ref: '#/components/schemas/Gender' }
        dateOfBirth: { type: string, format: date }
        cityId: { type: string, format: uuid }
        languages:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, maxLength: 5 }
        categoryIds:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, format: uuid }
        phone: { type: string, pattern: '^\+91[6-9][0-9]{9}$' }
        contactEmail: { type: string, format: email }
        audience: { $ref: '#/components/schemas/AudienceInfo' }
    SocialAccount:
      type: object
      required: [id, platform, handle, followers, avgLikes, avgComments, engagementRate, source, isPrimary]
      properties:
        id: { type: string, format: uuid }
        platform: { $ref: '#/components/schemas/Platform' }
        handle: { type: string, description: Instagram username or Facebook page URL }
        profileUrl: { type: string, format: uri }
        followers: { type: integer, minimum: 0 }
        avgLikes: { type: integer, minimum: 0 }
        avgComments: { type: integer, minimum: 0 }
        avgViews: { type: integer, minimum: 0 }
        engagementRate: { type: number, description: 'Percent, e.g. 4.12' }
        source: { $ref: '#/components/schemas/MetricSource' }
        isPrimary: { type: boolean }
    SocialAccountRequest:
      type: object
      required: [platform, handle, followers, avgLikes, avgComments]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        handle: { type: string, minLength: 1, maxLength: 200 }
        followers: { type: integer, minimum: 0, maximum: 100000000 }
        avgLikes: { type: integer, minimum: 0 }
        avgComments: { type: integer, minimum: 0 }
        avgViews: { type: integer, minimum: 0 }
        isPrimary: { type: boolean, default: false }
    PortfolioItem:
      type: object
      required: [id, url, platform]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        platform: { $ref: '#/components/schemas/Platform' }
        brandName: { type: string }
        thumbnailUrl: { type: string, format: uri }
    PortfolioItemRequest:
      type: object
      required: [url, platform]
      properties:
        url: { type: string, format: uri, maxLength: 500 }
        platform: { $ref: '#/components/schemas/Platform' }
        brandName: { type: string, maxLength: 100 }
        thumbnailFileId: { type: string, format: uuid }
    RateCardEntry:
      type: object
      required: [deliverableType]
      properties:
        deliverableType: { $ref: '#/components/schemas/DeliverableType' }
        pricePaise: { $ref: '#/components/schemas/Paise' }
        suggested: { $ref: '#/components/schemas/PriceRange' }
    RateCard:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/RateCardEntry' }
    UpdateRateCardRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 6
          items:
            type: object
            required: [deliverableType, pricePaise]
            properties:
              deliverableType: { $ref: '#/components/schemas/DeliverableType' }
              pricePaise: { $ref: '#/components/schemas/Paise' }
    SubmitVerificationRequest:
      type: object
      required: [proofFileIds]
      properties:
        proofFileIds:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, format: uuid }
        note: { type: string, maxLength: 500 }
    VerificationRequest:
      type: object
      required: [id, status, submittedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/VerificationStatus' }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time }
        reason: { type: string }
    PriceSuggestion:
      type: object
      required: [platform, deliverableType, tier, range]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        deliverableType: { $ref: '#/components/schemas/DeliverableType' }
        tier: { $ref: '#/components/schemas/FollowerTier' }
        range: { $ref: '#/components/schemas/PriceRange' }
        rateTableVersion: { type: integer }
    CreatorDashboard:
      type: object
      required: [status, openApplications, activeDeals, completedDeals, actionItems]
      properties:
        status: { $ref: '#/components/schemas/CreatorStatus' }
        openApplications: { type: integer }
        activeDeals: { type: integer }
        completedDeals: { type: integer }
        declaredEarningsPaise: { $ref: '#/components/schemas/Paise' }
        actionItems:
          type: array
          items: { $ref: '#/components/schemas/ActionItem' }
    ActionItem:
      type: object
      required: [type, title, link]
      properties:
        type: { type: string, description: 'e.g. SUBMIT_CONTENT, CONFIRM_PAYMENT, REVIEW_APPLICANTS' }
        title: { type: string }
        link: { type: string, description: Relative web path }
        dueDate: { type: string, format: date }
    CreatorCard:
      type: object
      required: [id, displayName, status, primaryPlatform, followers, engagementRate, categoryIds]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
        city: { type: string }
        status: { $ref: '#/components/schemas/CreatorStatus' }
        primaryPlatform: { $ref: '#/components/schemas/Platform' }
        handle: { type: string }
        followers: { type: integer }
        engagementRate: { type: number }
        metricSource: { $ref: '#/components/schemas/MetricSource' }
        categoryIds:
          type: array
          items: { type: string, format: uuid }
        ratingAvg: { type: number }
        dealsCompleted: { type: integer }
    CreatorPublicProfile:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CreatorCard'
        - type: object
          required: [socialAccounts, portfolio]
          properties:
            bio: { type: string }
            languages:
              type: array
              items: { type: string }
            audience: { $ref: '#/components/schemas/AudienceInfo' }
            socialAccounts:
              type: array
              items: { $ref: '#/components/schemas/SocialAccount' }
            portfolio:
              type: array
              items: { $ref: '#/components/schemas/PortfolioItem' }
            rateCard:
              type: array
              items: { $ref: '#/components/schemas/RateCardEntry' }

    # ─────────── brand ───────────
    BrandProfile:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BrandStatus' }
        brandName: { type: string }
        logoUrl: { type: string, format: uri }
        website: { type: string, format: uri }
        instagramHandle: { type: string }
        categoryId: { type: string, format: uuid }
        companySize: { $ref: '#/components/schemas/CompanySize' }
        city: { $ref: '#/components/schemas/City' }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string, format: email }
        gstin: { type: string }
        gstVerified: { type: boolean }
        ratingAvg: { type: number }
        ratingCount: { type: integer }
        dealsCompleted: { type: integer }
        paymentsConfirmedPercent: { type: integer, minimum: 0, maximum: 100 }
        missingFields:
          type: array
          items: { type: string }
    UpdateBrandProfileRequest:
      type: object
      required: [brandName, categoryId, contactName, contactPhone, contactEmail]
      properties:
        brandName: { type: string, minLength: 2, maxLength: 100 }
        logoFileId: { type: string, format: uuid }
        website: { type: string, format: uri, maxLength: 300 }
        instagramHandle: { type: string, maxLength: 60 }
        categoryId: { type: string, format: uuid }
        companySize: { $ref: '#/components/schemas/CompanySize' }
        cityId: { type: string, format: uuid }
        contactName: { type: string, minLength: 2, maxLength: 100 }
        contactPhone: { type: string, pattern: '^\+91[6-9][0-9]{9}$' }
        contactEmail: { type: string, format: email }
        gstin: { type: string, pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$' }
    BrandSummary:
      type: object
      required: [id, brandName]
      properties:
        id: { type: string, format: uuid }
        brandName: { type: string }
        logoUrl: { type: string, format: uri }
        website: { type: string, format: uri }
        ratingAvg: { type: number }
        paymentsConfirmedPercent: { type: integer }
        gstVerified: { type: boolean }
    BrandDashboard:
      type: object
      required: [activeCampaigns, newApplicants, activeDeals, actionItems]
      properties:
        activeCampaigns: { type: integer }
        newApplicants: { type: integer }
        activeDeals: { type: integer }
        completedDeals: { type: integer }
        actionItems:
          type: array
          items: { $ref: '#/components/schemas/ActionItem' }

    # ─────────── campaign ───────────
    CampaignCriteria:
      type: object
      required: [followersMin, followersMax]
      properties:
        followersMin: { type: integer, minimum: 0 }
        followersMax: { type: integer, minimum: 0 }
        cityIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        languages:
          type: array
          maxItems: 10
          items: { type: string }
        gender: { $ref: '#/components/schemas/GenderPreference' }
        engagementRateMin: { type: number, minimum: 0 }
    CampaignDeliverable:
      type: object
      required: [deliverableType, quantity]
      properties:
        deliverableType: { $ref: '#/components/schemas/DeliverableType' }
        quantity: { type: integer, minimum: 1, maximum: 10 }
        notes: { type: string, maxLength: 300 }
    CampaignInput:
      type: object
      required: [title, description, platform, categoryIds, compensationType, deliverables, criteria, creatorsNeeded, applyBy, contentWindowStart, contentWindowEnd]
      properties:
        title: { type: string, minLength: 5, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        productName: { type: string, maxLength: 120 }
        productUrl: { type: string, format: uri, maxLength: 500 }
        productValuePaise:
          allOf: [{ $ref: '#/components/schemas/Paise' }]
          description: MRP. Required when compensationType is PRODUCT or PRODUCT_PLUS_CASH.
        platform: { $ref: '#/components/schemas/Platform' }
        categoryIds:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, format: uuid }
        compensationType: { $ref: '#/components/schemas/CompensationType' }
        budgetMinPaise:
          allOf: [{ $ref: '#/components/schemas/Paise' }]
          description: Per creator cash budget. Required unless compensationType is PRODUCT.
        budgetMaxPaise: { $ref: '#/components/schemas/Paise' }
        deliverables:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/CampaignDeliverable' }
        criteria: { $ref: '#/components/schemas/CampaignCriteria' }
        creatorsNeeded: { type: integer, minimum: 1, maximum: 100 }
        guidelines: { type: string, maxLength: 5000 }
        hashtags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 50 }
        mentions:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 60 }
        referenceLinks:
          type: array
          maxItems: 10
          items: { type: string, format: uri }
        briefFileId: { type: string, format: uuid }
        applyBy: { type: string, format: date }
        contentWindowStart: { type: string, format: date }
        contentWindowEnd: { type: string, format: date }
    Campaign:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CampaignInput'
        - type: object
          required: [id, status, brand, approvedCount, applicationCount, createdAt]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/CampaignStatus' }
            brand: { $ref: '#/components/schemas/BrandSummary' }
            briefUrl: { type: string, format: uri }
            approvedCount: { type: integer }
            applicationCount: { type: integer }
            publishedAt: { type: string, format: date-time }
            closedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
    CampaignSummary:
      type: object
      required: [id, title, status, platform, compensationType, deliverables, creatorsNeeded, approvedCount, applicationCount, applyBy, brand]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        platform: { $ref: '#/components/schemas/Platform' }
        compensationType: { $ref: '#/components/schemas/CompensationType' }
        budgetMinPaise: { $ref: '#/components/schemas/Paise' }
        budgetMaxPaise: { $ref: '#/components/schemas/Paise' }
        productValuePaise: { $ref: '#/components/schemas/Paise' }
        deliverables:
          type: array
          items: { $ref: '#/components/schemas/CampaignDeliverable' }
        creatorsNeeded: { type: integer }
        approvedCount: { type: integer }
        applicationCount: { type: integer }
        applyBy: { type: string, format: date }
        brand: { $ref: '#/components/schemas/BrandSummary' }
    CampaignFeedItem:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CampaignSummary'
        - type: object
          required: [matchScore]
          properties:
            matchScore: { type: integer, minimum: 0, maximum: 100 }
            categoryIds:
              type: array
              items: { type: string, format: uuid }
            lowValueOffer:
              type: boolean
              description: Barter only - product MRP is below 50% of the creator's suggested minimum
            myApplicationStatus: { $ref: '#/components/schemas/ApplicationStatus' }
    CampaignForCreator:
      type: object
      required: [campaign, eligible, matchScore, suggestedQuote]
      properties:
        campaign: { $ref: '#/components/schemas/Campaign' }
        eligible: { type: boolean }
        ineligibleReasons:
          type: array
          items: { type: string }
        matchScore: { type: integer, minimum: 0, maximum: 100 }
        suggestedQuote:
          type: array
          description: Per-deliverable suggested cash price for this creator (cash part only for PRODUCT_PLUS_CASH)
          items: { $ref: '#/components/schemas/QuoteLineSuggestion' }
        lowValueOffer: { type: boolean }
        myApplication: { $ref: '#/components/schemas/Application' }
    QuoteLineSuggestion:
      type: object
      required: [deliverableType, quantity, range]
      properties:
        deliverableType: { $ref: '#/components/schemas/DeliverableType' }
        quantity: { type: integer }
        range: { $ref: '#/components/schemas/PriceRange' }
    BudgetSuggestionRequest:
      type: object
      required: [platform, criteria, deliverables]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        criteria: { $ref: '#/components/schemas/CampaignCriteria' }
        deliverables:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CampaignDeliverable' }
        compensationType: { $ref: '#/components/schemas/CompensationType' }
        productValuePaise: { $ref: '#/components/schemas/Paise' }

    # ─────────── application ───────────
    QuoteLine:
      type: object
      required: [deliverableType, quantity, unitPricePaise]
      properties:
        deliverableType: { $ref: '#/components/schemas/DeliverableType' }
        quantity: { type: integer, minimum: 1, maximum: 10 }
        unitPricePaise: { $ref: '#/components/schemas/Paise' }
    ApplyRequest:
      type: object
      required: [pitch, quote, availabilityConfirmed]
      properties:
        pitch: { type: string, minLength: 50, maxLength: 2000 }
        quote:
          type: array
          description: Must cover every campaign deliverable. Cash part only; for PRODUCT campaigns send unitPricePaise 0.
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/QuoteLine' }
        availabilityConfirmed:
          type: boolean
          const: true
    InviteCreatorRequest:
      type: object
      required: [creatorId]
      properties:
        creatorId: { type: string, format: uuid }
        message: { type: string, maxLength: 1000 }
    Application:
      type: object
      required: [id, campaignId, creatorId, status, origin, quote, quotedTotalPaise, createdAt]
      properties:
        id: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        creatorId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        origin: { $ref: '#/components/schemas/ApplicationOrigin' }
        pitch: { type: string }
        quote:
          type: array
          items: { $ref: '#/components/schemas/QuoteLine' }
        quotedTotalPaise: { $ref: '#/components/schemas/Paise' }
        suggestedTotal: { $ref: '#/components/schemas/PriceRange' }
        overBudget: { type: boolean }
        decisionReason: { type: string }
        dealId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
    MyApplication:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          required: [campaign]
          properties:
            campaign: { $ref: '#/components/schemas/CampaignSummary' }
    Applicant:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          required: [creator, matchScore]
          properties:
            creator: { $ref: '#/components/schemas/CreatorCard' }
            matchScore: { type: integer, minimum: 0, maximum: 100 }
    ApproveApplicationRequest:
      type: object
      properties:
        agreedTotalPaise:
          allOf: [{ $ref: '#/components/schemas/Paise' }]
          description: Defaults to quotedTotalPaise. Brand may record a negotiated amount.
    ApproveApplicationResponse:
      type: object
      required: [application, dealId]
      properties:
        application: { $ref: '#/components/schemas/Application' }
        dealId: { type: string, format: uuid }

    # ─────────── deal ───────────
    DealSummary:
      type: object
      required: [id, status, campaignId, campaignTitle, brand, creator, compensationType, agreedTotalPaise, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DealStatus' }
        campaignId: { type: string, format: uuid }
        campaignTitle: { type: string }
        brand: { $ref: '#/components/schemas/BrandSummary' }
        creator: { $ref: '#/components/schemas/UserRef' }
        compensationType: { $ref: '#/components/schemas/CompensationType' }
        agreedTotalPaise: { $ref: '#/components/schemas/Paise' }
        productValuePaise: { $ref: '#/components/schemas/Paise' }
        contentWindowEnd: { type: string, format: date }
        nextAction: { type: string, description: 'Hint for UI, e.g. SUBMIT_CONTENT, REVIEW_SUBMISSION, MARK_PAID' }
        createdAt: { type: string, format: date-time }
    Deal:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DealSummary'
        - type: object
          required: [deliverables, timeline, counterpartyContact, terms]
          properties:
            counterpartyContact: { $ref: '#/components/schemas/Contact' }
            terms:
              type: object
              required: [deliverables, contentWindowStart, contentWindowEnd]
              properties:
                deliverables:
                  type: array
                  items: { $ref: '#/components/schemas/CampaignDeliverable' }
                guidelines: { type: string }
                hashtags:
                  type: array
                  items: { type: string }
                mentions:
                  type: array
                  items: { type: string }
                contentWindowStart: { type: string, format: date }
                contentWindowEnd: { type: string, format: date }
            shipment:
              type: object
              properties:
                courier: { type: string }
                trackingId: { type: string }
                shippedAt: { type: string, format: date-time }
                receivedAt: { type: string, format: date-time }
            deliverables:
              type: array
              items: { $ref: '#/components/schemas/DealDeliverable' }
            payment: { $ref: '#/components/schemas/PaymentRecord' }
            myReview: { $ref: '#/components/schemas/Review' }
            counterpartyReview: { $ref: '#/components/schemas/Review' }
            cancelReason: { type: string }
            timeline:
              type: array
              items: { $ref: '#/components/schemas/DealEvent' }
    DealDeliverable:
      type: object
      required: [id, deliverableType, seq, status, revisionCount]
      properties:
        id: { type: string, format: uuid }
        deliverableType: { $ref: '#/components/schemas/DeliverableType' }
        seq: { type: integer }
        status: { $ref: '#/components/schemas/DeliverableStatus' }
        revisionCount: { type: integer }
        latestSubmission: { $ref: '#/components/schemas/Submission' }
    Submission:
      type: object
      required: [id, deliverableId, postUrl, disclosureConfirmed, reviewStatus, submittedAt]
      properties:
        id: { type: string, format: uuid }
        deliverableId: { type: string, format: uuid }
        postUrl: { type: string, format: uri }
        screenshotFileIds:
          type: array
          items: { type: string, format: uuid }
        notes: { type: string }
        disclosureConfirmed: { type: boolean }
        reviewStatus: { $ref: '#/components/schemas/SubmissionReviewStatus' }
        reviewComment: { type: string }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: string, format: date-time }
    CreateSubmissionRequest:
      type: object
      required: [postUrl, disclosureConfirmed]
      properties:
        postUrl: { type: string, format: uri, maxLength: 500 }
        screenshotFileIds:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
        notes: { type: string, maxLength: 1000 }
        disclosureConfirmed:
          type: boolean
          description: Creator confirms ASCI disclosure (#ad / #collab / paid partnership label)
    ProductShippedRequest:
      type: object
      properties:
        courier: { type: string, maxLength: 60 }
        trackingId: { type: string, maxLength: 60 }
    MarkPaymentRequest:
      type: object
      required: [amountPaise, mode, paidOn]
      properties:
        amountPaise:
          type: integer
          format: int64
          minimum: 100
        mode: { $ref: '#/components/schemas/PaymentMode' }
        reference: { type: string, maxLength: 100 }
        paidOn: { type: string, format: date }
    PaymentRecord:
      type: object
      required: [amountPaise, mode, paidOn, markedAt]
      properties:
        amountPaise: { $ref: '#/components/schemas/Paise' }
        mode: { $ref: '#/components/schemas/PaymentMode' }
        reference: { type: string }
        paidOn: { type: string, format: date }
        markedAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
    CreateReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }
    Review:
      type: object
      required: [id, rating, reviewer, createdAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        reviewer: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
    RaiseDisputeRequest:
      type: object
      required: [reason, description]
      properties:
        reason: { $ref: '#/components/schemas/DisputeReason' }
        description: { type: string, minLength: 20, maxLength: 2000 }
    Dispute:
      type: object
      required: [id, dealId, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        dealId: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/DisputeReason' }
        description: { type: string }
        status:
          type: string
          enum: [OPEN, RESOLVED]
        resolution: { type: string }
        createdAt: { type: string, format: date-time }
    DealEvent:
      type: object
      required: [type, occurredAt]
      properties:
        type: { type: string, description: 'e.g. DEAL_CREATED, PRODUCT_SHIPPED, SUBMISSION_CREATED' }
        actor: { $ref: '#/components/schemas/UserRef' }
        occurredAt: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
    DealMessage:
      type: object
      required: [id, sender, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        sender: { $ref: '#/components/schemas/UserRef' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }

    # ─────────── notification ───────────
    Notification:
      type: object
      required: [id, type, title, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        body: { type: string }
        link: { type: string, description: Relative web path }
        readAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    # ─────────── admin ───────────
    AdminVerificationItem:
      type: object
      required: [id, status, submittedAt, creator]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/VerificationStatus' }
        submittedAt: { type: string, format: date-time }
        creator: { $ref: '#/components/schemas/CreatorCard' }
    AdminVerificationDetail:
      type: object
      required: [verification, creator, socialAccounts, proofs]
      properties:
        verification: { $ref: '#/components/schemas/VerificationRequest' }
        creator: { $ref: '#/components/schemas/CreatorProfile' }
        socialAccounts:
          type: array
          items: { $ref: '#/components/schemas/SocialAccount' }
        proofs:
          type: array
          items: { $ref: '#/components/schemas/FileUrl' }
        note: { type: string }
        history:
          type: array
          items: { $ref: '#/components/schemas/VerificationRequest' }
    VerificationChecklist:
      type: object
      required: [handleMatches, followersWithinTolerance, insightsMatchHandle, engagementLooksReal, audienceMostlyIndia, contentSafe]
      properties:
        handleMatches: { type: boolean }
        followersWithinTolerance: { type: boolean }
        insightsMatchHandle: { type: boolean }
        engagementLooksReal: { type: boolean }
        audienceMostlyIndia: { type: boolean }
        contentSafe: { type: boolean }
    ApproveVerificationRequest:
      type: object
      required: [checklist]
      properties:
        checklist: { $ref: '#/components/schemas/VerificationChecklist' }
        verifiedMetrics:
          type: array
          items:
            type: object
            required: [socialAccountId, followers, engagementRate]
            properties:
              socialAccountId: { type: string, format: uuid }
              followers: { type: integer, minimum: 0 }
              engagementRate: { type: number, minimum: 0 }
    RejectVerificationRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
        checklist: { $ref: '#/components/schemas/VerificationChecklist' }
    AdminUser:
      type: object
      required: [id, email, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        displayName: { type: string }
        creatorStatus: { $ref: '#/components/schemas/CreatorStatus' }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RateTableRow:
      type: object
      required: [platform, deliverableType, tier, followersMin, basePaise]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        deliverableType: { $ref: '#/components/schemas/DeliverableType' }
        tier: { $ref: '#/components/schemas/FollowerTier' }
        followersMin: { type: integer, minimum: 0 }
        followersMax: { type: integer, minimum: 0, description: Omitted for the open-ended top tier }
        basePaise: { $ref: '#/components/schemas/PriceRange' }
    PricingModifier:
      type: object
      required: [code, multiplier, active]
      properties:
        code: { type: string, description: 'e.g. ER_LT_1, ER_GT_8, NICHE_BEAUTY, BUNDLE_3_PLUS' }
        multiplier: { type: number, minimum: 0 }
        active: { type: boolean }
        rule:
          type: object
          additionalProperties: true
    RateTable:
      type: object
      required: [version, rows, modifiers, activatedAt]
      properties:
        version: { type: integer }
        rows:
          type: array
          items: { $ref: '#/components/schemas/RateTableRow' }
        modifiers:
          type: array
          items: { $ref: '#/components/schemas/PricingModifier' }
        activatedAt: { type: string, format: date-time }
    ReplaceRateTableRequest:
      type: object
      required: [rows, modifiers]
      properties:
        rows:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RateTableRow' }
        modifiers:
          type: array
          items: { $ref: '#/components/schemas/PricingModifier' }
    AuditLog:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id: { type: string, format: uuid }
        actor: { $ref: '#/components/schemas/UserRef' }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    AdminMetrics:
      type: object
      required: [creators, verifiedCreators, pendingVerifications, brands, publishedCampaigns, applications, deals, completedDeals]
      properties:
        creators: { type: integer }
        verifiedCreators: { type: integer }
        pendingVerifications: { type: integer }
        brands: { type: integer }
        publishedCampaigns: { type: integer }
        applications: { type: integer }
        deals: { type: integer }
        completedDeals: { type: integer }
        declaredGmvPaise: { $ref: '#/components/schemas/Paise' }

    # ─────────── pages ───────────
    MyApplicationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyApplication' }
        nextCursor: { type: string }
    ApplicantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Applicant' }
        nextCursor: { type: string }
    CreatorCardPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CreatorCard' }
        nextCursor: { type: string }
    CampaignSummaryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CampaignSummary' }
        nextCursor: { type: string }
    CampaignFeedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CampaignFeedItem' }
        nextCursor: { type: string }
    DealSummaryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DealSummary' }
        nextCursor: { type: string }
    DealMessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DealMessage' }
        nextCursor: { type: string }
    NotificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        nextCursor: { type: string }
        unreadCount: { type: integer }
    AdminVerificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminVerificationItem' }
        nextCursor: { type: string }
    AdminUserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        nextCursor: { type: string }
    AuditLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        nextCursor: { type: string }
