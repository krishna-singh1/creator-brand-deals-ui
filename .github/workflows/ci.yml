name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, contract, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.branddeal.in/api/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Generated types must match the vendored contract (ADR 0009).
      - run: npm run api:check
      - run: npm run build
